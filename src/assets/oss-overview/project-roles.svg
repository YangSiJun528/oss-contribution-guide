<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img">
  <defs>
    <marker id="role-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #0f172a; }
      .heading { font: 700 21px system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #0f172a; }
      .body { font: 500 17px system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #334155; }
      .note { font: 500 16px system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="470" rx="24" fill="#f8fafc"/>
  <text x="54" y="58" class="title">프로젝트에서 책임과 권한이 나뉘는 흔한 모습</text>

  <rect x="54" y="110" width="190" height="210" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="78" y="152" class="heading">사용자</text>
  <text x="78" y="192" class="body">사용</text>
  <text x="78" y="222" class="body">문제 보고</text>
  <text x="78" y="252" class="body">커뮤니티 도움</text>

  <line x1="246" y1="215" x2="276" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#role-arrow)"/>

  <rect x="280" y="110" width="190" height="210" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="304" y="152" class="heading">기여자</text>
  <text x="304" y="192" class="body">변경 제안</text>
  <text x="304" y="222" class="body">문서·테스트</text>
  <text x="304" y="252" class="body">문제 분석</text>

  <line x1="472" y1="215" x2="502" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#role-arrow)"/>

  <rect x="506" y="110" width="190" height="210" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="530" y="152" class="heading">리뷰어</text>
  <text x="530" y="192" class="body">변경 검토</text>
  <text x="530" y="222" class="body">피드백</text>
  <text x="530" y="252" class="body">영역별 품질 확인</text>

  <line x1="698" y1="215" x2="728" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#role-arrow)"/>

  <rect x="732" y="110" width="190" height="210" rx="18" fill="#fdf2f8" stroke="#f472b6" stroke-width="2"/>
  <text x="756" y="152" class="heading">메인테이너</text>
  <text x="756" y="192" class="body">병합·릴리스</text>
  <text x="756" y="222" class="body">저장소 관리</text>
  <text x="756" y="252" class="body">지속적인 유지보수</text>

  <line x1="924" y1="215" x2="954" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#role-arrow)"/>

  <rect x="958" y="110" width="188" height="210" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="982" y="152" class="heading">거버넌스</text>
  <text x="982" y="192" class="body">최종 승인</text>
  <text x="982" y="222" class="body">정책·방향 결정</text>
  <text x="982" y="252" class="body">프로젝트 운영</text>

  <path d="M 150 358 C 385 410, 815 410, 1052 358" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#role-arrow)"/>
  <text x="406" y="432" class="note">오른쪽으로 갈수록 보통 책임과 권한의 범위가 넓어집니다.</text>
  <text x="54" y="456" class="note">가치의 서열이나 승진표가 아닙니다. 역할을 건너뛰거나 겸할 수 있고, 명칭과 권한은 프로젝트마다 다릅니다.</text>
</svg>
